<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Bài Học & AI Tutor - VLearn</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .tab-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
    }
    .tab-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .pdf-viewer-container {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body data-page="lesson">
  <div class="container">
    <div id="lesson-header"></div>

    <div class="lesson-layout">
      <!-- Left: Slide Viewer (PDF Gốc + Tóm tắt AI) -->
      <div class="slide-viewer-container">
        <div class="tab-bar">
          <button class="tab-btn active" onclick="switchTab('pdf')">📄 Slide Gốc (PDF Teacher)</button>
          <button class="tab-btn" onclick="switchTab('summary')">📝 Tóm tắt & Key Points (AI)</button>
          <button class="btn btn-primary btn-sm" style="margin-left: auto;" onclick="startQuiz()">✍️ Làm Quiz Cuối Buổi</button>
        </div>

        <!-- Tab 1: Embedded PDF -->
        <div id="tab-pdf" class="tab-content active pdf-viewer-container">
          <iframe src="/day02-slides.pdf#view=FitH" width="100%" height="820px" style="border: none;"></iframe>
        </div>

        <!-- Tab 2: Structured Slide Summary (Scrollable) -->
        <div id="tab-summary" class="tab-content scrollable-slides">
          <div id="slides-container">
            <!-- Rendered by JS -->
          </div>
          <div class="slide-action-footer">
            <button class="btn btn-outline" onclick="askAiToSummarizeAll()">🤖 Yêu cầu AI tóm tắt tổng quan</button>
            <button class="btn btn-primary btn-large" onclick="startQuiz()">✍️ Làm Quiz Cuối Buổi</button>
          </div>
        </div>
      </div>

      <!-- Right: AI Chat Bot UI Mock -->
      <div class="chat-sidebar">
        <div class="chat-header">
          <span>🤖 VLearn AI Tutor</span>
          <span style="font-size: 11px; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px;">Online</span>
        </div>
        <div class="chat-messages" id="chat-messages">
          <div class="chat-bubble bot">
            Xin chào! Bạn có thể đọc trực tiếp <strong>Slide PDF gốc của giảng viên</strong> hoặc xem tóm tắt AI bên tab cạnh, và hỏi tôi bất cứ điều gì về bài học nhé.
          </div>
        </div>
        <div class="chat-quick-actions">
          <button class="quick-btn" onclick="sendQuickPrompt('Tóm tắt ý chính toàn bài')">📝 Tóm tắt bài học</button>
          <button class="quick-btn" onclick="sendQuickPrompt('Lấy ví dụ thực tế về Gate')">💡 Ví dụ thực tế</button>
          <button class="quick-btn" onclick="sendQuickPrompt('Phân biệt LLM Feature và Agent')">⚖️ Feature vs Agent</button>
        </div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="Nhắn gì đó cho AI tutor..." onkeypress="handleChatKeypress(event)">
          <button onclick="sendUserMessage()">Gửi</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      if (tabName === 'pdf') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-pdf').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-summary').classList.add('active');
      }
    }
  </script>
</body>
</html>
